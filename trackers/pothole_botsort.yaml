# Pothole-Tuned BoT-SORT configuration for vehicle dashcam footage
# Uses sparse optical flow GMC to compensate for camera vehicle motion.

tracker_type: botsort
track_high_thresh: 0.20
track_low_thresh: 0.10
new_track_thresh: 0.20
track_buffer: 6
match_thresh: 0.50
fuse_score: True

# BoT-SORT camera motion compensation
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False

